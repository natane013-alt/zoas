<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pergunta Importante</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background: #f2f2f2;
        }
        .btn {
            padding: 15px 30px;
            margin: 20px;
            font-size: 20px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }
        #sim {
            background: #00c853;
            color: white;
        }
        #nao {
            background: #d50000;
            color: white;
            position: absolute;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(5); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Você é gay 😏</h1>

    <button id="sim" class="btn">SIM 💚</button>
    <button id="nao" class="btn">NÃO ❌</button>

    <script>
        const nao = document.getElementById("nao");

        nao.addEventListener("mouseover", () => {
            const x = Math.random() * window.innerWidth * 0.8;
            const y = Math.random() * window.innerHeight * 0.8;

            nao.style.left = x + "px";
            nao.style.top = y + "px";
        });

        nao.addEventListener("click", () => {
            nao.style.animation = "explode 0.4s forwards";
            setTimeout(() => nao.remove(), 400);
        });
    </script>

</body>
</html>
